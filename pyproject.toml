[project]
name = "redepict"
version = "0.1.0"
description = "ReDepict — веб-приложение, которое помогает начинающим художникам получать профессиональную обратную связь по своим работам."
readme = "README.md"
authors = [
    { name = "TimeJerker", email = "krov1chh@gmail.com" },
    { name = "KsysaY", email = "jashina.xen@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
redepict = "redepict:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
